services:
  n8n:
    image: naskio/n8n-python:latest
    container_name: n8n_nbs_orchestrator
    restart: always

    ports:
      - "5678:5678"

    env_file:
      - .env

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - NODES_EXCLUDE=[]

    volumes:
      - n8n_data:/home/node/.n8n
      - ./samples:/data/nbs_reports
      - ./src:/data/src

volumes:
  n8n_data: